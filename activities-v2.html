<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>白袍人生學院 · 近期活動</title>
<link rel="icon" href="wcla-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@300;400;500;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* 白袍人生學院 CIS：60% 白袍白／30% 學院藍／10% 曙光金 */
  :root{
    --navy:#1A3D63; --ink:#0E2A45; --sky:#5E8CB5; --gold:#E0A235;
    --white:#FBF9F3; --graphite:#2E343A; --cloud:#E9E7E0; --paper:#FFFFFF;
    --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
    --sans:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;
    --latin:'Montserrat','Noto Sans TC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--white);color:var(--graphite);font-family:var(--sans);font-size:15px;line-height:1.75;min-height:100vh}
  img{max-width:100%}
  [hidden]{display:none!important}
  a{color:inherit}
  .wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

  /* ---------- 頁首 ---------- */
  header{background:var(--paper);border-bottom:1px solid var(--cloud);padding-top:env(safe-area-inset-top)}
  header .wrap{display:flex;align-items:center;gap:20px;padding-block:18px;flex-wrap:wrap}
  .logo{height:64px;width:auto;display:block}
  .hgroup{flex:1;min-width:0}
  .eyebrow{font-family:var(--latin);font-size:11px;letter-spacing:.24em;color:var(--sky);font-weight:600}
  .hgroup h1{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--navy);line-height:1.3;margin-top:2px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:4px;padding:11px 18px;font-family:var(--sans);font-weight:500;font-size:14px;text-decoration:none;cursor:pointer;line-height:1.2;transition:opacity .15s,background .15s}
  .btn:active{opacity:.85}
  .btn:focus-visible,.chip:focus-visible,.dm:focus-visible,.more:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .btn-navy{background:var(--navy);color:var(--white)}
  .btn-navy:hover{background:var(--ink)}
  .btn-gold{background:var(--gold);color:var(--ink);font-weight:700}
  .btn-line{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1px var(--sky)}
  .btn-line:hover{background:var(--cloud)}

  /* ---------- 工具列 ---------- */
  .toolbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:28px 8px;flex-wrap:wrap}
  .count{font-size:14px}
  .count b{font-family:var(--latin);font-size:22px;color:var(--navy);margin-right:4px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border:1px solid var(--cloud);background:var(--paper);color:var(--graphite);border-radius:999px;padding:9px 18px;font-size:13px;font-family:var(--sans);cursor:pointer;line-height:1.2}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--white)}

  /* ---------- 區塊標題 ---------- */
  .sec-head{display:flex;align-items:baseline;gap:12px;padding-block:40px 4px}
  .sec-head h2{font-family:var(--serif);font-weight:900;font-size:24px;color:var(--navy)}
  .sec-head span{font-family:var(--latin);font-size:11px;letter-spacing:.22em;color:var(--sky);font-weight:600}

  /* ---------- 近期活動：左資訊 | 右 DM ---------- */
  .list{display:flex;flex-direction:column;gap:28px;padding-block:20px 8px}
  .event{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--paper);border:1px solid var(--cloud);border-radius:6px;overflow:hidden;transition:box-shadow .2s}
  .event:hover{box-shadow:0 8px 28px rgba(26,61,99,.10)}
  .info{padding:34px 36px;display:flex;flex-direction:column;justify-content:center;gap:18px;min-width:0}
  .top{display:flex;align-items:center;gap:14px}
  .date{display:flex;align-items:baseline;gap:10px;font-family:var(--latin);color:var(--navy)}
  .date .d{font-size:44px;font-weight:700;line-height:1}
  .date .m{font-size:13px;letter-spacing:.14em;font-weight:600;color:var(--sky);line-height:1.3}
  .status{margin-left:auto;font-size:12px;font-weight:500;padding:4px 12px;border-radius:3px;white-space:nowrap}
  .s-open{background:var(--navy);color:var(--white)}
  .s-plan,.s-end{background:var(--cloud);color:var(--graphite)}
  .s-full{background:var(--graphite);color:var(--white)}
  .kicker{font-size:13px;color:var(--sky);font-weight:500;letter-spacing:.06em;margin-bottom:-10px}
  .title{font-family:var(--serif);font-weight:900;font-size:26px;line-height:1.45;color:var(--navy);text-wrap:balance;overflow-wrap:anywhere}
  .rule{width:44px;height:3px;background:var(--gold)}
  dl{display:grid;grid-template-columns:64px 1fr;row-gap:8px;column-gap:14px;font-size:15px}
  dt{color:var(--sky);font-weight:500;font-size:13px;padding-top:2px}
  dd{color:var(--graphite);min-width:0;overflow-wrap:anywhere}
  .tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:3px;margin-left:8px;vertical-align:1px;white-space:nowrap}
  .tag-on{background:var(--cloud);color:var(--navy)}
  .tag-off{background:var(--navy);color:var(--white)}
  .actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:6px}
  .note{font-size:13px;color:var(--graphite);opacity:.8}
  .note a{color:var(--navy);font-weight:500}

  .dm{background:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;min-height:320px;position:relative;cursor:zoom-in;border:0;width:100%;font:inherit}
  .dm img{max-width:100%;max-height:460px;width:auto;height:auto;display:block;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .dm .hint{position:absolute;right:12px;top:12px;font-size:12px;color:var(--white);background:rgba(14,42,69,.75);padding:4px 10px;border-radius:999px}
  .dm-empty{cursor:default;flex-direction:column;gap:10px;color:var(--white)}
  .glow{width:90px;height:90px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(224,162,53,.35) 0deg 9deg,transparent 9deg 18deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
  .dm-empty p{font-size:14px;opacity:.85}
  .dm-empty small{font-size:12px;color:var(--gold);font-family:var(--latin);letter-spacing:.1em}

  /* ---------- 往期活動：精簡卡片 ---------- */
  .past{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-block:20px 8px}
  .pcard{background:var(--paper);border:1px solid var(--cloud);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
  .pthumb{display:block;width:100%;aspect-ratio:16/10;background:var(--ink);border:0;padding:0;cursor:zoom-in;overflow:hidden}
  .pthumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85)}
  .pthumb.empty{cursor:default;display:flex;align-items:center;justify-content:center;color:var(--white);font-size:13px;opacity:.9}
  .pbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .pdate{font-family:var(--latin);font-size:12px;letter-spacing:.1em;color:var(--sky);font-weight:600}
  .ptitle{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.5;color:var(--navy);overflow-wrap:anywhere}
  .pmeta{font-size:13px;color:var(--graphite);opacity:.85}
  .shares{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
  .shares a{font-size:12px;color:var(--navy);text-decoration:none;border:1px solid var(--sky);border-radius:999px;padding:3px 12px}
  .shares a:hover{background:var(--cloud)}
  .more-wrap{display:flex;justify-content:center;padding-block:12px 0}
  .more{background:var(--paper);border:1px solid var(--sky);color:var(--navy);font-family:var(--sans);font-size:14px;padding:11px 26px;border-radius:999px;cursor:pointer}

  .state{text-align:center;padding:56px 16px;color:var(--sky);font-size:15px}
  .spinner{width:34px;height:34px;border:3px solid var(--cloud);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- DM 放大 ---------- */
  .modal{position:fixed;inset:0;background:rgba(14,42,69,.94);display:flex;align-items:center;justify-content:center;padding:max(48px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:50}
  .modal img{max-width:100%;max-height:100%;object-fit:contain}
  .modal-close{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:40px;height:40px;background:rgba(251,249,243,.12);border:0;border-radius:50%;color:var(--white);font-size:20px;cursor:pointer}

  footer{border-top:1px solid var(--cloud);background:var(--paper);margin-top:56px}
  footer .wrap{padding-block:22px calc(22px + env(safe-area-inset-bottom));font-size:12px;color:var(--sky);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  footer a{color:var(--navy)}

  /* ---------- 平板 ---------- */
  @media (max-width:960px){ .past{grid-template-columns:repeat(2,minmax(0,1fr))} }

  /* ---------- 手機：上 DM、下資訊 ---------- */
  @media (max-width:820px){
    .event{grid-template-columns:1fr}
    .dm{order:-1;min-height:0;padding:0}
    .dm img{width:100%;max-height:72vh;object-fit:contain;border-radius:0;box-shadow:none}
    .dm-empty{flex-direction:row;padding:18px 20px;gap:14px;justify-content:flex-start}
    .dm-empty .glow{width:44px;height:44px;flex-shrink:0}
    .dm-empty small{margin-left:auto}
    .info{padding:24px 20px 26px;gap:16px}
    .title{font-size:22px}
    .date .d{font-size:38px}
    .zoom-btn{display:none}
    .actions:not(:has(> :not(.zoom-btn))){display:none}
    .actions .btn-gold,.actions .btn-navy{flex:1 1 100%;padding:14px 18px;font-size:16px}
  }
  @media (max-width:600px){
    header .wrap{gap:14px;padding-block:14px}
    .logo{height:56px}
    .eyebrow{display:none}
    .hgroup h1{font-size:24px;margin:0}
    header .btn-navy{width:100%}
    .toolbar .wrap{padding-block:20px 4px;gap:12px}
    .chips{width:100%}
    .chip{flex:1}
    .list{gap:20px}
    dl{grid-template-columns:52px 1fr}
    .sec-head{padding-block:32px 0}
    .sec-head h2{font-size:21px}
    .past{grid-template-columns:1fr;gap:12px}
    .pcard{flex-direction:row}
    .pthumb{width:36%;flex-shrink:0;aspect-ratio:auto;min-height:120px}
    .pthumb.empty{font-size:12px;padding:8px;text-align:center}
    .pbody{padding:12px 14px;gap:4px;min-width:0}
    .pdate{font-size:11px}
    .ptitle{font-size:15px}
    .pmeta{font-size:12px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation-duration:0s!important} }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="logo" src="wcla-logo.png" alt="DR.HAO 白袍人生學院">
    <div class="hgroup">
      <div class="eyebrow">WHITE COAT LIFE ACADEMY · EVENTS</div>
      <h1>近期活動</h1>
    </div>
    <a id="headerDlBtn" class="btn btn-navy" href="#" target="_blank" rel="noopener" hidden>精英醫師訪談專刊下載</a>
  </div>
</header>

<section class="toolbar">
  <div class="wrap">
    <div class="count" id="countBar"></div>
    <div class="chips" role="group" aria-label="篩選活動形式">
      <button class="chip" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" data-f="實體" aria-pressed="false">實體</button>
      <button class="chip" data-f="線上" aria-pressed="false">線上</button>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="list" id="upcomingList">
    <div class="state"><div class="spinner"></div>載入活動中…</div>
  </div>

  <section id="pastSection" hidden>
    <div class="sec-head"><h2>往期活動</h2><span>PAST EVENTS</span></div>
    <div class="past" id="pastList"></div>
    <div class="more-wrap" id="moreWrap" hidden><button class="more" id="moreBtn">顯示更多往期活動</button></div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>白袍人生學院 ｜ 一群人一起打拼，走得更遠。</span>
    <span>報名與詢問請洽 <a href="https://lin.ee/0TZvAZH" target="_blank" rel="noopener">白袍人生學院官方 LINE</a></span>
  </div>
</footer>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-label="活動 DM">
  <button class="modal-close" id="modalClose" aria-label="關閉">✕</button>
  <img id="modalImg" alt="">
</div>

<script>
const SHEET_ID  = '1DtKZiuGA5bN8f7gABgKSLfFMOUSL3gdKfmUjcUdkh2Q';
const SHEET_GID = '0';
const CSV_URL   = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;
const LINE_URL  = 'https://lin.ee/0TZvAZH';

// 欄位對應（A=0, B=1 … S=18），與 activities.html 相同
// A 課程狀態 | B 活動名稱 | C 活動日期 | D 活動S-time | E 活動D-time
// F 活動講師 | G 活動地點 | H 活動形式 | I 重要性 | J 負責人
// K 報名費用 | L 開放LINE OA報名 | M 會員報名連結 | N 白院群友報名連結
// O 活動DM   | P 學員分享#1 | Q 學員分享#2 | R 學員分享#3 | S 專刊
const COL = {
  status:0, name:1, date:2, stime:3, dtime:4,
  speaker:5, location:6, format:7, importance:8, manager:9,
  fee:10, signupOpen:11, memberLink:12, friendLink:13,
  dm:14, share1:15, share2:16, share3:17, journal:18
};

const PAST_PAGE = 6;          // 往期活動一次顯示幾筆
let UPCOMING = [], PAST = [];
let filter = 'all', pastShown = PAST_PAGE;

const startOfToday = (() => { const d = new Date(); d.setHours(0,0,0,0); return d; })();

// CSV 解析：支援引號內的逗號與換行（活動名稱可能有換行）
function parseCSV(text) {
  const rows = []; let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur.trim()); cur = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cur.trim()); rows.push(row); row = []; cur = '';
    } else cur += c;
  }
  if (cur || row.length) { row.push(cur.trim()); rows.push(row); }
  return rows.filter(r => r.some(v => v));
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toRawUrl(url) {
  if (!url) return '';
  return url
    .replace('https://github.com/', 'https://raw.githubusercontent.com/')
    .replace('/blob/', '/');
}

function parseDate(s) {
  const m = (s || '').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}

function fmt(t) { return (t || '').substring(0, 5); }

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const WEEK   = ['週日','週一','週二','週三','週四','週五','週六'];

// 把【系列名稱】拆成小標，標題中的換行與「｜」改成換行
function splitTitle(name) {
  let kicker = '', title = (name || '').trim();
  const m = title.match(/^【([^】]+)】\s*/);
  if (m) {
    kicker = m[1].replace(/^白袍人生學院\s*(｜|\||\sl\s)\s*/, '').replace(/_/g, '・').trim();
    title = title.slice(m[0].length).trim();
  }
  return { kicker, title };
}
function titleHTML(t) {
  return esc(t).replace(/\s*\n\s*/g, '<br>').replace(/\s*｜\s*/g, '<br>');
}

function hostLabel(speaker) {
  return /學院|主辦/.test(speaker) ? '主辦' : '講師';
}

function statusClass(s) {
  if (s === '招生中') return 's-open';
  if (s === '招生額滿') return 's-full';
  if (s === '規劃中') return 's-plan';
  return 's-end';
}

function dmBlock(a, idx) {
  if (!a.dm) {
    return `<div class="dm dm-empty"><div class="glow"></div><p>活動 DM 製作中</p><small>COMING SOON</small></div>`;
  }
  return `<button class="dm" data-dm="${esc(a.dm)}" data-alt="${esc(a.name)} 活動 DM" aria-label="放大活動 DM">
      <img src="${esc(a.dm)}" alt="${esc(a.name)} 活動 DM" loading="${idx < 2 ? 'eager' : 'lazy'}"
           onerror="this.closest('.dm').outerHTML='<div class=&quot;dm dm-empty&quot;><div class=&quot;glow&quot;></div><p>DM 圖片暫時無法顯示</p></div>'">
      <span class="hint">點圖放大</span>
    </button>`;
}

function signupBlock(a) {
  let html = '';
  if (a.status === '規劃中') {
    return `<span class="note">報名資訊即將公布，請留意<a href="${LINE_URL}" target="_blank" rel="noopener">官方 LINE</a> 通知。</span>`;
  }
  if (a.status === '招生額滿') return `<span class="note">本場已招生額滿，感謝大家的支持。</span>`;
  if (a.signupOpen) {
    if (a.memberLink && !['已截止報名','請洽官方LINE'].includes(a.memberLink))
      html += `<a class="btn btn-gold" href="${esc(a.memberLink)}" target="_blank" rel="noopener">立即報名</a>`;
    if (a.friendLink && a.friendLink !== '請洽官方LINE')
      html += `<a class="btn btn-navy" href="${esc(a.friendLink)}" target="_blank" rel="noopener">群友報名連結</a>`;
  }
  if (!html) html = `<span class="note">報名請洽<a href="${LINE_URL}" target="_blank" rel="noopener">白袍人生學院官方 LINE</a></span>`;
  return html;
}

function upcomingCard(a, idx) {
  const d = a.dateObj;
  const { kicker, title } = splitTitle(a.name);
  const online = a.format === '線上';
  const time = a.stime ? fmt(a.stime) + (a.dtime ? ' – ' + fmt(a.dtime) : '') : '';
  return `
  <article class="event" data-format="${esc(a.format)}">
    <div class="info">
      <div class="top">
        ${d ? `<div class="date"><span class="d">${d.getDate()}</span><span class="m">${MONTHS[d.getMonth()]} ${d.getFullYear()}<br>${WEEK[d.getDay()]}</span></div>` : ''}
        ${a.status ? `<span class="status ${statusClass(a.status)}">${esc(a.status)}</span>` : ''}
      </div>
      ${kicker ? `<div class="kicker">${esc(kicker)}</div>` : ''}
      <h3 class="title">${titleHTML(title)}</h3>
      <div class="rule"></div>
      <dl>
        ${time ? `<dt>時間</dt><dd>${esc(time)}</dd>` : ''}
        ${a.speaker ? `<dt>${hostLabel(a.speaker)}</dt><dd>${esc(a.speaker)}</dd>` : ''}
        ${a.location || a.format ? `<dt>地點</dt><dd>${esc(a.location)}${a.format ? `<span class="tag ${online ? 'tag-off' : 'tag-on'}">${esc(a.format)}</span>` : ''}</dd>` : ''}
        ${a.fee ? `<dt>費用</dt><dd>${esc(a.fee)}</dd>` : ''}
      </dl>
      <div class="actions">
        ${signupBlock(a)}
        ${a.dm ? `<button class="btn btn-line zoom-btn" data-dm="${esc(a.dm)}" data-alt="${esc(a.name)} 活動 DM">放大看 DM</button>` : ''}
      </div>
    </div>
    ${dmBlock(a, idx)}
  </article>`;
}

function pastCard(a) {
  const d = a.dateObj;
  const { kicker, title } = splitTitle(a.name);
  const shares = [a.share1, a.share2, a.share3].map(s => (s || '').trim()).filter(s => /^https?:\/\//.test(s));
  return `
  <article class="pcard" data-format="${esc(a.format)}">
    ${a.dm
      ? `<button class="pthumb" data-dm="${esc(a.dm)}" data-alt="${esc(a.name)} 活動 DM" aria-label="放大活動 DM"><img src="${esc(a.dm)}" alt="${esc(a.name)} 活動 DM" loading="lazy" onerror="this.parentElement.classList.add('empty');this.parentElement.removeAttribute('data-dm');this.replaceWith('DM 暫時無法顯示')"></button>`
      : `<div class="pthumb empty">白袍人生學院</div>`}
    <div class="pbody">
      <div class="pdate">${d ? `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${WEEK[d.getDay()]}` : esc(a.date)}${a.format ? ' ・ ' + esc(a.format) : ''}</div>
      <div class="ptitle">${kicker ? `<span style="display:block;font-family:var(--sans);font-weight:500;font-size:12px;color:var(--sky)">${esc(kicker)}</span>` : ''}${esc(title).replace(/\s*\n\s*/g, ' ')}</div>
      ${a.speaker ? `<div class="pmeta">${hostLabel(a.speaker)}｜${esc(a.speaker)}</div>` : ''}
      ${shares.length ? `<div class="shares">${shares.map((s, i) => `<a href="${esc(s)}" target="_blank" rel="noopener">學員分享 ${i+1}</a>`).join('')}</div>` : ''}
    </div>
  </article>`;
}

function render() {
  const match = a => filter === 'all' || a.format === filter;
  const up = UPCOMING.filter(match), past = PAST.filter(match);

  document.getElementById('countBar').innerHTML = up.length
    ? `<b>${up.length}</b>場活動即將舉辦`
    : '近期活動規劃中，敬請期待';

  document.getElementById('upcomingList').innerHTML = up.length
    ? up.map(upcomingCard).join('')
    : `<div class="state">目前沒有${filter === 'all' ? '' : filter}的近期活動，歡迎看看往期活動。</div>`;

  const pastSection = document.getElementById('pastSection');
  pastSection.hidden = !past.length;
  document.getElementById('pastList').innerHTML = past.slice(0, pastShown).map(pastCard).join('');
  document.getElementById('moreWrap').hidden = past.length <= pastShown;
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    const dataRows = rows.slice(1).filter(r => r[COL.name] && r[COL.name].trim());

    // 專刊：S 欄第一筆有值的，轉成 Google Drive 預覽連結
    const journalRaw = dataRows.map(r => r[COL.journal] || '').find(v => v.trim()) || '';
    const journalUrl = journalRaw.trim().replace(
      /https:\/\/drive\.google\.com\/file\/d\/([^/]+)\/view.*/,
      'https://drive.google.com/file/d/$1/preview'
    );
    const dlBtn = document.getElementById('headerDlBtn');
    if (journalUrl) { dlBtn.href = journalUrl; dlBtn.hidden = false; }

    const all = dataRows.map(r => ({
      status:     (r[COL.status]     || '').trim(),
      name:        r[COL.name]        || '',
      date:        r[COL.date]        || '',
      dateObj:     parseDate(r[COL.date]),
      stime:       r[COL.stime]       || '',
      dtime:       r[COL.dtime]       || '',
      speaker:     r[COL.speaker]     || '',
      location:    r[COL.location]    || '',
      format:     (r[COL.format]      || '').trim(),
      fee:         r[COL.fee]         || '',
      signupOpen: (r[COL.signupOpen] || '').trim().toUpperCase() === 'Y',
      memberLink: (r[COL.memberLink]  || '').trim(),
      friendLink: (r[COL.friendLink]  || '').trim(),
      dm:          toRawUrl((r[COL.dm] || '').trim()),
      share1:      r[COL.share1]      || '',
      share2:      r[COL.share2]      || '',
      share3:      r[COL.share3]      || '',
    }));

    // 「課程結束」或日期已過 → 往期；其餘 → 近期
    const isPast = a => a.status === '課程結束' || (a.dateObj && a.dateObj < startOfToday);
    const time = a => a.dateObj ? a.dateObj.getTime() : Infinity;
    UPCOMING = all.filter(a => !isPast(a)).sort((a, b) => time(a) - time(b));
    PAST     = all.filter(isPast).sort((a, b) => time(b) - time(a));
    render();
  } catch (e) {
    document.getElementById('upcomingList').innerHTML =
      `<div class="state">活動資料載入失敗，請重新整理頁面再試一次。<br><small style="font-size:12px;opacity:.7">${esc(e.message)}</small></div>`;
  }
}

/* 篩選 */
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  filter = c.dataset.f; pastShown = PAST_PAGE; render();
}));
document.getElementById('moreBtn').addEventListener('click', () => { pastShown += PAST_PAGE; render(); });

/* DM 放大 */
const modal = document.getElementById('modal'), modalImg = document.getElementById('modalImg');
document.addEventListener('click', e => {
  const t = e.target.closest('[data-dm]');
  if (!t) return;
  modalImg.src = t.dataset.dm; modalImg.alt = t.dataset.alt || '活動 DM';
  modal.hidden = false; document.body.style.overflow = 'hidden';
});
function closeModal() { modal.hidden = true; modalImg.src = ''; document.body.style.overflow = ''; }
document.getElementById('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

loadData();
</script>
</body>
</html>
