<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白袍人生學院｜自動對帳系統</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161921;
    --surface2: #1e2230;
    --border: #2a2f3d;
    --accent: #4f8fff;
    --accent2: #7c6fff;
    --green: #2ecc8a;
    --amber: #f5a623;
    --red: #ff5f5f;
    --gray: #8890a4;
    --text: #e8eaf2;
    --text2: #9aa0b5;
    --font: 'Noto Sans TC', 'SF Pro Text', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }
  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 12px;
  }
  .topbar-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
  .topbar-sub { font-size: 12px; color: var(--text2); margin-left: auto; }
  .main { display: flex; gap: 0; height: calc(100vh - 57px); }
  .sidebar {
    width: 300px; min-width: 300px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px;
    display: flex; flex-direction: column; gap: 20px;
    overflow-y: auto;
  }
  .section-label {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: var(--text2); text-transform: uppercase; margin-bottom: 8px;
  }
  .drop-zone {
    border: 1.5px dashed var(--border);
    border-radius: 10px; padding: 18px 14px;
    text-align: center; cursor: pointer; transition: all .2s; position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: rgba(79,143,255,.06); }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .drop-icon { font-size: 22px; margin-bottom: 6px; }
  .drop-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .drop-hint { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .file-loaded { background: rgba(46,204,138,.08); border-color: var(--green); border-style: solid; }
  .file-loaded .drop-title { color: var(--green); }
  .col-map { display: flex; flex-direction: column; gap: 8px; }
  .col-row { display: flex; align-items: center; gap: 8px; }
  .col-row label { font-size: 12px; color: var(--text2); width: 60px; flex-shrink: 0; }
  .col-row select {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none;
  }
  .col-row select:focus { border-color: var(--accent); }
  .run-btn {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .15s, transform .1s; letter-spacing: .3px;
  }
  .run-btn:hover { opacity: .9; transform: translateY(-1px); }
  .run-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat-card { background: var(--surface2); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
  .stat-num { font-size: 22px; font-weight: 700; line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 3px; }
  .stat-card.green .stat-num { color: var(--green); }
  .stat-card.amber .stat-num { color: var(--amber); }
  .stat-card.red .stat-num { color: var(--red); }
  .stat-card.blue .stat-num { color: var(--accent); }
  .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .filter-tabs { display: flex; gap: 4px; }
  .tab { padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid transparent; color: var(--text2); transition: all .15s; }
  .tab:hover { background: var(--surface2); }
  .tab.active { background: rgba(79,143,255,.15); color: var(--accent); border-color: rgba(79,143,255,.3); }
  .search-box {
    margin-left: auto; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; color: var(--text); font-size: 12px; outline: none; width: 180px;
  }
  .search-box:focus { border-color: var(--accent); }
  .export-btn {
    padding: 5px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .export-btn:hover { border-color: var(--accent); color: var(--accent); }
  .table-wrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--surface); padding: 10px 14px; text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: .5px; color: var(--text2);
    text-transform: uppercase; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody td { padding: 10px 14px; font-size: 13px; }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: .3px;
  }
  .badge.paid { background: rgba(46,204,138,.12); color: var(--green); }
  .badge.pending { background: rgba(136,144,164,.1); color: var(--gray); }
  .badge.warning { background: rgba(245,166,35,.12); color: var(--amber); }
  .badge.dup { background: rgba(124,111,255,.12); color: var(--accent2); }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; color: var(--text2); padding: 60px 20px;
  }
  .empty-icon { font-size: 48px; opacity: .3; }
  .empty-title { font-size: 16px; font-weight: 500; }
  .empty-hint { font-size: 13px; text-align: center; max-width: 300px; line-height: 1.6; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--gray); }

  /* ── Login overlay ── */
  #loginOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 40px 36px; width: 360px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .login-logo { display: flex; align-items: center; gap: 12px; }
  .login-logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .login-logo-name { font-size: 14px; font-weight: 600; line-height: 1.4; }
  .login-logo-sub { font-size: 11px; color: var(--text2); }
  .login-field { display: flex; flex-direction: column; gap: 6px; }
  .login-field label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .login-field input {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    padding: 10px 12px; outline: none; transition: border-color .15s;
    font-family: var(--font); width: 100%;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .15s; letter-spacing: .3px; font-family: var(--font); margin-top: 4px;
  }
  .login-btn:hover { opacity: .9; }
  .login-error { font-size: 12px; color: var(--red); text-align: center; min-height: 18px; }
  .login-footer { font-size: 11px; color: var(--text2); text-align: center; line-height: 1.6; border-top: 1px solid var(--border); padding-top: 16px; }
  #appWrapper { display: none; }
</style>
</head>

<div class="main">

    <div id="colMapSection" style="display:none">
      <div class="section-label">② 欄位對應設定</div>

          <label>姓名</label>
          <select id="colName"></select>
        </div>
        <div class="col-row">
          <label>末五碼</label>
          <select id="colCode"></select>
        </div>
        <div class="col-row">
          <label>應付金額</label>
          <select id="colAmount"></select>
        </div>
        <div class="col-row">
          <label>繳費狀態</label>

            <option value="">(無此欄位)</option>
          </select>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">③ 玉山銀行帳單</div>
      <div class="drop-zone" id="bankZone">
        <input type="file" id="bankFile" accept=".xlsx,.xls" onchange="loadBankFile(this)" multiple>
        <div class="drop-icon">🏦</div>
        <div class="drop-title" id="bankTitle">拖曳或點擊上傳</div>
        <div class="drop-hint">可多次上傳累積，不會覆蓋</div>
      </div>
    </div>

    <hr class="divider">

    <button class="run-btn" id="runBtn" onclick="runReconcile()" disabled>開始對帳</button>

    <div id="statsSection" style="display:none">
      <div class="section-label">對帳結果</div>
      <div class="stats-grid">
        <div class="stat-card blue"><div class="stat-num" id="statTotal">0</div><div class="stat-label">總報名人數</div></div>
        <div class="stat-card green"><div class="stat-num" id="statPaid">0</div><div class="stat-label">已繳費</div></div>
        <div class="stat-card red"><div class="stat-num" id="statPending">0</div><div class="stat-label">待繳費</div></div>
        <div class="stat-card amber"><div class="stat-num" id="statWarn">0</div><div class="stat-label">需確認</div></div>

  </div>

  <div class="content">

      <div class="filter-tabs">
        <div class="tab active" onclick="setFilter('all',this)">全部</div>
        <div class="tab" onclick="setFilter('paid',this)">已繳費</div>
        <div class="tab" onclick="setFilter('pending',this)">待繳費</div>
        <div class="tab" onclick="setFilter('warning',this)">金額異常</div>
        <div class="tab" onclick="setFilter('dup',this)">重複末五碼</div>

    </div>

    <div id="emptyState" class="empty-state">
      <div class="empty-icon">📊</div>
      <div class="empty-title">尚未執行對帳</div>

        <thead>
          <tr>
            <th>#</th>

            <th>應付金額</th>
            <th>實際入帳</th>
            <th>入帳日期</th>
            <th>帳單備註</th>
            <th>繳費狀態</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
let regRows = [];
let bankRows = [];
let resultRows = [];
let bankFileCount = 0;
let currentFilter = 'all';

function normCode(v) {
  if (v == null || v === '' || String(v).toLowerCase() === 'xxx') return null;
  const s = String(v).trim().replace(/[^0-9]/g, '');
  if (!s || s.length < 3) return null;
  return s.slice(-5).padStart(5, '0');
}

function extractAmount(v) {
  if (v == null) return null;
  if (typeof v === 'number' && v > 0) return v;
  const m = String(v).match(/[\$＄]([0-9,，]+)/);
  if (m) return parseInt(m[1].replace(/[,，]/g, ''));
  const n = parseInt(String(v).replace(/[,，]/g, ''));
  return isNaN(n) ? null : n;
}

function fmtDate(v) {
  if (!v) return '';
  if (v instanceof Date) return v.toLocaleDateString('zh-TW');
  return String(v).split(' ')[0];
}

function loadRegFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
    const sheetName = wb.SheetNames.find(n => n.includes('報名')) || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    const data = XLSX.utils.sheet_to_json(ws, { defval: null });
    regRows = data;
    const cols = data.length > 0 ? Object.keys(data[0]) : [];
    populateColSelects(cols);
    autoDetectColumns(cols);
    document.getElementById('regZone').classList.add('file-loaded');
    document.getElementById('regTitle').textContent = `✓ ${file.name}（${data.length} 筆）`;
    document.getElementById('colMapSection').style.display = 'block';
    checkRunnable();
  };
  reader.readAsArrayBuffer(file);
}

function populateColSelects(cols) {
  ['colName','colCode','colAmount','colStatus'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = id === 'colStatus' ? '<option value="">(無此欄位)</option>' : '';
    cols.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c; opt.textContent = c.length > 22 ? c.slice(0,22)+'…' : c;
      opt.title = c;
      sel.appendChild(opt);
    });
  });
}

function autoDetectColumns(cols) {
  const pick = (patterns) => cols.find(c => patterns.some(p => c.toLowerCase().includes(p.toLowerCase())));
  document.getElementById('colName').value   = pick(['中文姓名','醫師 姓名','醫師姓名','姓名']) || cols[0];
  document.getElementById('colCode').value   = pick(['後五碼','末五碼','帳號後五碼','後5碼']) || cols[0];
  document.getElementById('colAmount').value = pick(['#金額','金額','方案選擇']) || cols[0];
  const statusCol = pick(['匯款確認','繳費狀態']);
  document.getElementById('colStatus').value = statusCol || '';
}

function loadBankFile(input) {
  const files = Array.from(input.files);
  let done = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });
      // Find header row with 帳務日期
      let hi = raw.findIndex(r => r.some(c => c && String(c).includes('帳務日期')));
      if (hi < 0) hi = 5;
      const headers = raw[hi];
      const rows = raw.slice(hi + 1)
        .filter(r => r[0] != null && String(r[0]).trim() !== '' && !isNaN(parseInt(r[0])))
        .map(r => { const o = {}; headers.forEach((h,i) => { if(h) o[h]=r[i]; }); return o; })
        .filter(r => parseFloat(r['存'] || 0) > 0);
      bankRows = bankRows.concat(rows);
      bankFileCount++;
      done++;
      if (done === files.length) {
        document.getElementById('bankZone').classList.add('file-loaded');
        document.getElementById('bankTitle').textContent = `✓ ${bankFileCount} 份帳單 / ${bankRows.length} 筆入帳`;
        checkRunnable();
      }
    };
    reader.readAsArrayBuffer(file);
  });
}

function checkRunnable() {
  document.getElementById('runBtn').disabled = !(regRows.length > 0 && bankRows.length > 0);
}

function runReconcile() {
  const colName   = document.getElementById('colName').value;
  const colCode   = document.getElementById('colCode').value;
  const colAmount = document.getElementById('colAmount').value;
  const colStatus = document.getElementById('colStatus').value;

  // Build bank map: code -> [{amount, date, note}]
  const bankMap = {};
  bankRows.forEach(b => {
    const acct = b['轉出入銀行代號/帳號'] || b['帳號'] || '';
    const code = normCode(acct);
    if (!code) return;
    const amount = parseFloat(b['存'] || 0);
    if (!bankMap[code]) bankMap[code] = [];
    bankMap[code].push({
      amount,
      date: fmtDate(b['帳務日期'] || b['實際交易日期']),
      note: String(b['備註'] || '')
    });
  });

  // Count duplicate codes in reg
  const codeCount = {};
  regRows.forEach(r => {
    const c = normCode(r[colCode]);
    if (c) codeCount[c] = (codeCount[c] || 0) + 1;
  });

  resultRows = regRows.map((r, idx) => {
    const name = String(r[colName] || '').trim();
    if (!name || name.toLowerCase() === 'xxx') return null;

    const code = normCode(r[colCode]);
    const expectedAmt = extractAmount(r[colAmount]);
    const existingStatus = colStatus ? r[colStatus] : null;

    let status = 'pending';
    let actualAmt = null;
    let matchDate = '';
    let matchNote = '';
    let reason = '';

    // Already marked paid in sheet
    if (existingStatus === true || existingStatus === 'True' || String(existingStatus).includes('已繳')) {
      status = 'paid'; reason = '報名表已標記已繳費';
    }

    if (!code) {
      reason = reason || '未填末五碼';
    } else if (bankMap[code]) {
      const matches = bankMap[code];
      const exact = expectedAmt ? matches.find(m => Math.abs(m.amount - expectedAmt) < 1) : null;
      const any = matches[0];

      if (exact || (!expectedAmt && any)) {
        const hit = exact || any;
        status = 'paid';
        actualAmt = hit.amount;
        matchDate = hit.date;
        matchNote = hit.note;
      } else if (any) {
        status = 'warning';
        actualAmt = any.amount;
        matchDate = any.date;
        matchNote = any.note;
        reason = `末五碼符合，但金額不符（入帳 $${any.amount.toLocaleString()}，應付 $${expectedAmt ? expectedAmt.toLocaleString() : '未知'}）`;
      }

      if (codeCount[code] > 1 && status !== 'pending') {
        status = 'dup';
        reason = `此末五碼有 ${codeCount[code]} 筆報名，需人工確認`;
      }
    }

    return { idx: idx+1, name, code: code || String(r[colCode]||'').trim() || '—', expectedAmt, actualAmt, matchDate, matchNote, status, reason };
  }).filter(Boolean);

  // Stats
  const c = {paid:0,pending:0,warning:0,dup:0};
  resultRows.forEach(r => c[r.status]++);
  document.getElementById('statTotal').textContent = resultRows.length;
  document.getElementById('statPaid').textContent = c.paid;
  document.getElementById('statPending').textContent = c.pending;
  document.getElementById('statWarn').textContent = c.warning + c.dup;
  document.getElementById('statsSection').style.display = 'block';

  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('tableWrap').style.display = 'block';
  renderTable();
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  let rows = resultRows;
  if (currentFilter !== 'all') rows = rows.filter(r => r.status === currentFilter);
  if (q) rows = rows.filter(r => r.name.toLowerCase().includes(q) || r.code.includes(q));

  const badge = (r) => {
    const map = { paid:['paid','✓ 已繳費'], pending:['pending','· 待繳費'], warning:['warning','⚠ 金額異常'], dup:['dup','⚑ 重複末五碼'] };
    const [cls, label] = map[r.status] || ['pending','未知'];
    const tip = r.reason ? ` title="${r.reason}"` : '';
    return `<span class="badge ${cls}"${tip}><span class="dot"></span>${label}</span>`;
  };
  const fa = (v) => v != null ? `$${Number(v).toLocaleString()}` : '—';

  document.getElementById('tableBody').innerHTML = rows.map(r => `
    <tr>
      <td style="color:var(--text2);font-size:12px">${r.idx}</td>
      <td style="font-weight:500">${r.name}</td>
      <td style="font-family:monospace;letter-spacing:2px;font-size:13px">${r.code}</td>
      <td style="font-variant-numeric:tabular-nums">${fa(r.expectedAmt)}</td>
      <td style="font-variant-numeric:tabular-nums;color:${r.actualAmt?'var(--green)':'var(--text2)'}">${fa(r.actualAmt)}</td>
      <td style="color:var(--text2)">${r.matchDate||'—'}</td>
      <td style="color:var(--text2);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.matchNote}">${r.matchNote||'—'}</td>
      <td>${badge(r)}</td>
    </tr>`).join('');
}

function exportResult() {
  if (!resultRows.length) return alert('請先執行對帳');
  const data = resultRows.map(r => ({
    '序號': r.idx, '姓名': r.name, '末五碼': r.code,
    '應付金額': r.expectedAmt, '實際入帳': r.actualAmt,
    '入帳日期': r.matchDate, '帳單備註': r.matchNote,
    '繳費狀態': {paid:'已繳費',pending:'待繳費',warning:'金額異常',dup:'重複末五碼'}[r.status],
    '備註說明': r.reason
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [5,12,10,12,12,12,24,12,28].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '對帳結果');
  XLSX.writeFile(wb, `對帳結果_${new Date().toLocaleDateString('zh-TW').replace(/\//g,'')}.xlsx`);
}

['regZone','bankZone'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('drag-over');
    const input = el.querySelector('input[type=file]');
    const dt = new DataTransfer();
    Array.from(e.dataTransfer.files).forEach(f => dt.items.add(f));
    input.files = dt.files;
    input.dispatchEvent(new Event('change'));
  });
});

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim().toLowerCase();
  const pwd   = document.getElementById('loginPwd').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  if (!email || !pwd) { errEl.textContent = '請填寫帳號與密碼'; return; }
  const hash = await sha256(pwd);
  if (email === ALLOWED_EMAIL && hash === PWD_HASH) {
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('appWrapper').style.display = 'block';
    sessionStorage.setItem('auth', '1');
  } else {
    errEl.textContent = '帳號或密碼錯誤，請重試';
    document.getElementById('loginPwd').value = '';
  }
}
